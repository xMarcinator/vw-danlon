[workspace]
members = [".", "app"]

[package]
name = "vw-danlon"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
calamine = { version = "0.37.0", default-features = false }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
rpassword = "7.5.4"
rrule = "0.14.0"
rusqlite = { version = "0.38.0", features = ["bundled", "chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
toml_edit = "0.25.17"
ureq = { version = "3.5.0", features = ["platform-verifier"] }

[dev-dependencies]
rust_xlsxwriter = { version = "0.101.0", default-features = false }
