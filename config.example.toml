# Your employee number in Danløn — must match exactly.
employee_number = "1"
timezone = "Europe/Copenhagen"

# Fixed workplace. Arriving here always counts as being at work, also on days
# where the calendar says you are elsewhere (e.g. a colleague drives you on).
workplace = "Kontorvej 1, 8000 Aarhus C"

# Optional coordinates ("lat, lon", e.g. copied from a map) of home and the
# workplace. A trip ending within radius_m metres of one counts as arriving
# there, whatever address the trip export shows. `home` needs mileage.home.
# [places]
# workplace = "56.1572, 10.2107"
# home = "56.1890, 10.1820"
# radius_m = 150

# Fallback norm hours per weekday, used when the calendar does not set the
# norm (calendar.norm_from_calendar = false or no [calendar]).
[work_week]
mon = 7.4
tue = 7.4
wed = 7.4
thu = 7.4
fri = 7.4

[holidays]
danish_public = true   # helligdage (Store bededag only before 2024)
grundlovsdag = true
christmas_eve = true
new_years_eve = true

# Proton Calendar: Settings → All settings → Calendars → (your calendar) →
# "Share with anyone" → Create link (full view). Paste the link here.
# Use a dedicated calendar, e.g. "Arbejdstid":
#  - timed events for your working hours, each with the work ADDRESS in the
#    location field (a repeating event for your normal week, single events
#    for days at other addresses)
#  - all-day events for ferie / fridage
# Working time = from arriving at the event's address until leaving it.
[calendar]
source = "examples/arbejdstid.ics"   # or "https://calendar.proton.me/api/calendar/v1/url/…"
name = "Arbejdstid"                   # refuse to run if the link points at another calendar
norm_from_calendar = true
days_off_keywords = []                # e.g. ["ferie", "fri"] to filter all-day events
private_keywords = ["Læge", "Tandlæge", "Fysioterapeut"]  # timed entries that are private, not work time
# default_location = "Kontorvej 1, 8000 Aarhus C"   # for days without a located entry

# More calendars, for private appointments only: they never set planned
# hours, days off or vacation. use = "private": every timed event is a
# private appointment; use = "words_only": only titles with a private word.
# [[extra_calendars]]
# source = "https://calendar.proton.me/api/calendar/v1/url/…/calendar.ics"
# use = "private"
# name = "Personal"

[periods]
round_to_minutes = 0
count_travel_time = false   # true: include the drive to/from the work address

# Lunch break, deducted only where it overlaps time at work. A timed calendar
# event with this title sets the day's lunch instead; `lunch set` overrides both.
[lunch]
start = "12:00"
minutes = 30
title = "Frokost"

# Tax-free mileage allowance (skattefri kørselsgodtgørelse).
[mileage]
driver_name = "Dit Navn"
registration_number = "AB12345"
home = "Hjemvej 3, 8200 Aarhus N"   # with workplace: home ↔ workplace is commuting, never reimbursed
# address = "Hjemvej 3, 8200 Aarhus N"   # on the logbook (default: home)
# cpr = ""                                # on the logbook; blank line when empty
# yderkommune = false                     # befordringsfradrag: higher rate above 120 km a day

# Rates from Skatterådet. VERIFY on skat.dk before use.
[[mileage.rates]]
year = 2026
low = 3.94             # kr/km up to 20,000 km per year
high = 2.28            # kr/km above
threshold_km = 20000

# Befordringsfradrag rates (LL § 9 C); 2026 is built in.
# [[mileage.fradrag_rates]]
# year = 2027
# low = 3.17               # kr/km of the daily round trip from 25 to 120 km
# high = 1.59              # kr/km above 120 km
# yderkommune_high = 3.51  # above 120 km when yderkommune = true

# Names of home and the workplace as used in the Danløn app's Kørsel routes.
# Other stops are named by their calendar entry's title, else their address.
# [checklist]
# home_name = "Hjem"
# workplace_name = "Kontoret"

# Vacation (samtidighedsferie) from all-day calendar events; see `vacation`.
# An all-day event whose title contains a word (any case, also inside a longer
# word: "Juleferie") is vacation; only its working days count.
# [vacation]
# keywords = ["Ferie"]
# feriefridag_keywords = ["Feriefridag"]   # wins over keywords
# employment_start = 2026-05-01            # earning starts here; unset: from 1 Sep
# feriefridage = 5                         # per holiday year, from the contract
# days_per_month = 2.08                    # days earned per full month

# Working from home: a timed work event whose title has one of these words
# (whole word, any case), or whose location is mileage.home, counts its
# planned window as worked without trips; see also `home start|stop`.
# [home_working]
# keywords = ["Hjemmearbejde", "Hjemme"]
# at_home_address = true

# Private calendar appointments (see calendar.private_keywords) start
# automatically when their planned start has passed; one you have not
# started, stopped or changed by grace_minutes after its planned end is
# recorded with its planned window, marked "calendar time".
# [private]
# auto_start = true
# grace_minutes = 60

[danlon]
# "none": Danløn reports its own Normtimer (160,33 for 37 h/week), which is
#         what Skat expects for full-time monthly salaried employees.
# "actual": also export actual worked hours on hours_lonart.
hours = "none"
# hours_lonart = "XXXX"
# Lønart for skattefri kørselsgodtgørelse. 39 = Kilometerpenge: Danløn takes
# only the km and applies its own rate. Check the code in Danløn.
mileage_lonart = "39"
# File layout — check against Danløn's file description before first import.
delimiter = ";"
decimal_comma = true
header = false
columns = ["employee", "lonart", "quantity"]   # code 39 allows no rate


# Optional: sync trips from your Min Volkswagen account (`account connect`,
# unofficial access). Only a device token is kept, in the system keychain, or
# in `token_file` (readable only by you) on machines without one.
# [connected_cars]
# email = "you@example.com"
# vehicle = "AB12345"                    # only if the account has several cars
# token_file = "connected-cars-token"    # relative to this file; never committed
