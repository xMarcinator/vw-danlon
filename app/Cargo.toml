[package]
name = "vw-danlon-app"
version = "0.9.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
chrono-tz = "0.10.4"
dioxus = "0.7.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "time"] }
toml = "1.1.8"
toml_edit = "0.25.17"
vw-danlon = { path = ".." }
# The chart library shared with flow-next-tracker (private, so pinned by commit, not published).
flow-next-charts = { git = "ssh://git@github.com/xMarcinator/flow-next-tracker.git", rev = "d77c462e0c734aef130af5771d53d2d7d5c8c114" }
flow-next-draw = { git = "ssh://git@github.com/xMarcinator/flow-next-tracker.git", rev = "d77c462e0c734aef130af5771d53d2d7d5c8c114" }

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
dirs = "6.0.0"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"
jni = "0.21.1"
keyring-core = "1.0.1"
ndk-context = "0.1.1"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
