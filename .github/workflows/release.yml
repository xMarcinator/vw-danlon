# Builds and publishes a release when a version tag is pushed:
#   git tag v0.5.0 && git push origin v0.5.0
# The tag must match the version in app/Cargo.toml. The APK is signed with
# the release keystore kept in the repository's GitHub secrets, so every
# computer publishes with the same key and nobody signs locally.
#
# Secrets:
#   ANDROID_KEYSTORE_BASE64    release.jks, base64 encoded
#   ANDROID_KEYSTORE_PASSWORD  its password
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.5.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  DX_VERSION: 0.7.10
  NDK_VERSION: 30.0.16248370
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: v
        name: Tag matches app/Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' app/Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match app/Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Desktop libraries for the app crate
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  apk:
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Android platform, build tools and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "ndk;${NDK_VERSION}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - name: Dioxus CLI
        run: cargo binstall -y --locked "dioxus-cli@${DX_VERSION}"
      - name: Release keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD are not set"
            exit 1
          fi
          dir=$RUNNER_TEMP/keystore
          mkdir -p "$dir"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$dir/release.jks"
          printf '%s' "$KEYSTORE_PASSWORD" > "$dir/release.jks.pass"
          chmod 600 "$dir"/*
          echo "VW_DANLON_KEYSTORE=$dir/release.jks" >> "$GITHUB_ENV"
          echo "VW_DANLON_KEYSTORE_PASS=$dir/release.jks.pass" >> "$GITHUB_ENV"
      - name: Build and sign the APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: scripts/build-apk.sh
      - name: Remove the keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error

  cli:
    needs: [version, test]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            exe: vw-danlon
          - os: windows-latest
            name: windows-x86_64
            exe: vw-danlon.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p vw-danlon --bin vw-danlon
      - name: Package
        shell: bash
        run: |
          out=vw-danlon-cli-${{ needs.version.outputs.version }}-${{ matrix.name }}
          mkdir -p "dist/$out"
          cp "target/release/${{ matrix.exe }}" README.md config.example.toml "dist/$out/"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then 7z a "$out.zip" "$out" > /dev/null; else tar czf "$out.tar.gz" "$out"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: dist/vw-danlon-cli-*.*
          if-no-files-found: error

  desktop:
    needs: [version, test]
    # The desktop app is a bonus: a failure here does not stop the release.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - name: Dioxus CLI
        run: cargo binstall -y --locked "dioxus-cli@${{ env.DX_VERSION }}"
      - name: Bundle the desktop app
        shell: bash
        working-directory: app
        run: |
          if [ "$RUNNER_OS" = Windows ]; then platform=windows types=msi; else platform=linux types=appimage; fi
          dx bundle --platform "$platform" --release --package-types "$types" --out-dir ../dist/desktop
      - name: Name the bundles
        shell: bash
        run: |
          v=${{ needs.version.outputs.version }}
          mkdir -p dist/out
          for f in dist/desktop/*.AppImage dist/desktop/*.msi; do
            [ -f "$f" ] || continue
            cp "$f" "dist/out/vw-danlon-app-$v-${{ matrix.name }}.${f##*.}"
          done
          ls dist/out
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: dist/out/*
          if-no-files-found: error

  release:
    needs: [version, apk, cli, desktop]
    if: always() && needs.apk.result == 'success' && needs.cli.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Checksums
        run: cd files && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: vw-danlon ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: files/*
