# Builds and publishes a release when a version tag is pushed (APKs are
# only built here, never locally):
#   git tag v0.5.0 && git push origin v0.5.0
# The tag must match the version in app/Cargo.toml. The APK is signed with
# the release keystore kept in the repository's GitHub secrets, so every
# computer publishes with the same key and nobody signs locally.
#
# The release appears at once as a pre-release, each file is uploaded to it
# as soon as its job has built it, and the release is completed (marked as
# the latest release, with notes and SHA256SUMS.txt) when the APK and the
# command-line builds succeeded. If the tests, the APK or the command-line
# build fail, the pre-release is marked as failed (title, notes with the
# run's link), or deleted when no file made it (the tag stays).
#
# Secrets:
#   ANDROID_KEYSTORE_BASE64    release.jks, base64 encoded
#   ANDROID_KEYSTORE_PASSWORD  its password
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.5.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  DX_VERSION: 0.7.10
  NDK_VERSION: 30.0.16248370
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: v
        name: Tag matches app/Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' app/Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match app/Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  prerelease:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Create the pre-release (or reuse it on a re-run)
        run: |
          v=${{ needs.version.outputs.version }}
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --title "vw-danlon $v (building…)"
          else
            gh release create "$TAG" --verify-tag --prerelease \
              --title "vw-danlon $v (building…)" \
              --notes "Files are added here as they are built. This release is completed when the APK and the command-line tool are done."
          fi

  test:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Desktop libraries for the app crate
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - run: cargo test --workspace --locked

  apk:
    needs: [version, test, prerelease]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_TOOLS: "36.1.0"
      PLATFORM: android-36
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      # The NDK, build tools and platform are large: keep them between runs.
      - name: Cache Android SDK packages
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
            /usr/local/lib/android/sdk/build-tools/${{ env.BUILD_TOOLS }}
            /usr/local/lib/android/sdk/platforms/${{ env.PLATFORM }}
          key: android-sdk-${{ env.NDK_VERSION }}-${{ env.BUILD_TOOLS }}-${{ env.PLATFORM }}
      - name: Android platform, build tools and NDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: sdkmanager "platforms;$PLATFORM" "build-tools;$BUILD_TOOLS" "ndk;$NDK_VERSION"
      - name: Android paths and the NDK compiler for C dependencies (ring)
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          ndk_bin=$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin
          echo "NDK_BIN=$ndk_bin" >> "$GITHUB_ENV"
          echo "BT=$ANDROID_HOME/build-tools/$BUILD_TOOLS" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$ndk_bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$ndk_bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ndk_bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      # Cargo registry, target dir and ~/.cargo/bin (so dx is kept too).
      - uses: Swatinem/rust-cache@v2
        with:
          key: apk
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-dx${{ env.DX_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: gradle-${{ runner.os }}-dx${{ env.DX_VERSION }}-
      - uses: cargo-bins/cargo-binstall@main
      - name: Dioxus CLI
        run: |
          if ! dx --version 2>/dev/null | grep -q "^dioxus $DX_VERSION"; then
            cargo binstall -y --force --locked "dioxus-cli@$DX_VERSION"
          fi
      # Gradle downloads itself with a 10 s timeout here, which fails now
      # and then on GitHub's runners: try up to three times.
      - name: Bundle with dx
        working-directory: app
        run: |
          for attempt in 1 2 3; do
            dx bundle --platform android --release --target aarch64-linux-android --package-types apk && exit 0
            echo "::warning::dx bundle failed (attempt $attempt), retrying"
            sleep 20
          done
          exit 1
      # dx 0.7 packages its Gradle *debug* variant (debuggable, unstripped
      # .so). Patch the generated project and build its release variant.
      - name: Prepare the generated Gradle project
        run: |
          g=target/dx/vw-danlon-app/release/android/app
          echo "GRADLE_DIR=$g" >> "$GITHUB_ENV"
          "$NDK_BIN/llvm-strip" --strip-all "$g/app/src/main/jniLibs/arm64-v8a/libmain.so"
          # Only arm64.
          find "$g/app/src/main/jniLibs" -mindepth 1 -maxdepth 1 ! -name arm64-v8a -exec rm -rf {} +
          # No R8: the generated project has no keep rules for the classes Rust calls over JNI.
          sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/' "$g/app/build.gradle.kts"
          # dx writes versionCode = 1; Android only updates when it grows: 0.5.0 -> 500.
          IFS=. read -r major minor patch <<< "$VERSION"
          sed -i "s/versionCode = [0-9]*/versionCode = $((major * 10000 + minor * 100 + patch))/" "$g/app/build.gradle.kts"
          # Handle dark mode, font and display changes in place: Android would
          # otherwise recreate the activity, which the Dioxus app does not survive.
          sed -i 's/android:configChanges="[^"]*"/android:configChanges="orientation|screenLayout|screenSize|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode|fontScale|fontWeightAdjustment|density|locale|layoutDirection|colorMode"/' \
            "$g/app/src/main/AndroidManifest.xml"
          # DayNight so the System theme follows the phone's dark mode.
          sed -i 's/Theme.AppCompat.Light.NoActionBar/Theme.AppCompat.DayNight.NoActionBar/' "$g/app/src/main/res/values/styles.xml"
          # Our launcher icon instead of dx's.
          rm -f "$g"/app/src/main/res/mipmap-*/ic_launcher* "$g/app/src/main/res/values/ic_launcher_background.xml"
          cp -r app/icons/android/res/. "$g/app/src/main/res/"
      - name: Gradle release build
        run: |
          cd "$GRADLE_DIR"
          ./gradlew assembleRelease -q -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease
      - name: Sign with the release key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD are not set"
            exit 1
          fi
          k=$RUNNER_TEMP/keystore
          mkdir -p "$k" && chmod 700 "$k"
          trap 'rm -rf "$k"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$k/release.jks"
          printf '%s' "$KEYSTORE_PASSWORD" > "$k/pass"
          mkdir -p dist
          out=dist/vw-danlon-$VERSION-arm64.apk
          "$BT/zipalign" -f -p 4 "$GRADLE_DIR/app/build/outputs/apk/release/app-release-unsigned.apk" "$k/aligned.apk"
          "$BT/apksigner" sign --ks "$k/release.jks" --ks-key-alias vw-danlon --ks-pass "file:$k/pass" \
            --out "$out" "$k/aligned.apk"
          rm -f "$out.idsig"
      - name: Verify
        run: |
          out=dist/vw-danlon-$VERSION-arm64.apk
          "$BT/apksigner" verify --print-certs "$out" | grep -E 'Signer( #1)?:? certificate (DN|SHA-256)'
          if "$BT/aapt2" dump badging "$out" | grep -q application-debuggable; then
            echo "::error::$out is debuggable"; exit 1
          fi
          "$BT/aapt2" dump badging "$out" | grep -o "versionCode='[0-9]*' versionName='[^']*'"
          ls -lh "$out"
      - name: Upload to the release
        run: gh release upload "$TAG" dist/*.apk --clobber

  cli:
    needs: [version, test, prerelease]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            exe: vw-danlon
          - os: windows-latest
            name: windows-x86_64
            exe: vw-danlon.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli
      # The keychain support (keyring, Secret Service) links D-Bus on Linux.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo build --release --locked -p vw-danlon --bin vw-danlon
      - name: Package
        shell: bash
        run: |
          out=vw-danlon-cli-${{ needs.version.outputs.version }}-${{ matrix.name }}
          mkdir -p "dist/$out"
          cp "target/release/${{ matrix.exe }}" README.md config.example.toml "dist/$out/"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then 7z a "$out.zip" "$out" > /dev/null; else tar czf "$out.tar.gz" "$out"; fi
      - name: Upload to the release
        shell: bash
        run: |
          shopt -s nullglob
          gh release upload "$TAG" dist/vw-danlon-cli-*.tar.gz dist/vw-danlon-cli-*.zip --clobber

  desktop:
    needs: [version, test, prerelease]
    # The desktop app is a bonus: a failure here does not stop the release.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
      - uses: cargo-bins/cargo-binstall@main
      - name: Dioxus CLI
        shell: bash
        run: |
          if ! dx --version 2>/dev/null | grep -q "^dioxus $DX_VERSION"; then
            cargo binstall -y --force --locked "dioxus-cli@$DX_VERSION"
          fi
      - name: Bundle the desktop app
        shell: bash
        working-directory: app
        run: |
          if [ "$RUNNER_OS" = Windows ]; then platform=windows types=msi; else platform=linux types=appimage; fi
          dx bundle --platform "$platform" --release --package-types "$types" --out-dir ../dist/desktop
      - name: Name the bundles
        shell: bash
        run: |
          v=${{ needs.version.outputs.version }}
          mkdir -p dist/out
          for f in dist/desktop/*.AppImage dist/desktop/*.msi; do
            [ -f "$f" ] || continue
            cp "$f" "dist/out/vw-danlon-app-$v-${{ matrix.name }}.${f##*.}"
          done
          ls dist/out
      - name: Upload to the release
        shell: bash
        run: gh release upload "$TAG" dist/out/* --clobber

  complete:
    needs: [version, test, apk, cli, desktop]
    if: always() && needs.test.result == 'success' && needs.apk.result == 'success' && needs.cli.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checksums
        run: |
          mkdir files && cd files
          gh release download "$TAG" --skip-existing
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
      - name: Complete the release
        run: |
          v=${{ needs.version.outputs.version }}
          gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body > notes.md
          if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -q '^vw-danlon-app-'; then
            printf '\n\nThe desktop app could not be built for this release.\n' >> notes.md
          fi
          gh release edit "$TAG" --prerelease=false --latest --title "vw-danlon $v" --notes-file notes.md

  failed:
    needs: [version, prerelease, test, apk, cli, desktop]
    if: always() && needs.prerelease.result == 'success' && (needs.test.result != 'success' || needs.apk.result != 'success' || needs.cli.result != 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Mark the release as failed, or delete it when it has no files
        run: |
          v=${{ needs.version.outputs.version }}
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          files=$(gh release view "$TAG" --json assets --jq '.assets | length')
          if [ "$files" = 0 ]; then
            gh release delete "$TAG" --yes
            echo "Deleted the empty release $TAG (the tag is kept)."
          else
            {
              echo "**This build failed** (tests ${{ needs.test.result }}, APK ${{ needs.apk.result }}, command-line ${{ needs.cli.result }})."
              echo
              echo "The files here are what was built before it stopped. See $run_url and re-run it from the Actions tab (Run workflow, tag $TAG)."
            } > notes.md
            gh release edit "$TAG" --prerelease --title "vw-danlon $v (failed)" --notes-file notes.md
          fi
